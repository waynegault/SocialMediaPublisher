name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # The application drives browsers and Windows tooling, so the gate runs on
    # Windows to match the checkout's own environment.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Create the repository environment
        # run_tests.py refuses to run under any interpreter but the checkout's
        # own .venv ("Run tests with the repository virtual environment: ..."),
        # the same rule the developer's machine follows. The gate builds that
        # environment rather than weakening the rule.
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Tests
        env:
          # The runner prints an emoji in its banner, and a hosted Windows console
          # defaults to cp1252, so print() raised UnicodeEncodeError and killed the
          # step. Handling UTF-8 is the environment's job, not the runner's: its
          # output stays exactly as written.
          PYTHONUTF8: "1"
        # The repository's own runner in its declared default mode: unit tests
        # with the live browser and API tests switched off, which is what this
        # runner's usage note documents. Its --integration mode needs real
        # authenticated sessions, so it stays a local concern.
        run: .\.venv\Scripts\python.exe run_tests.py
